[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboagent-ai"
version = "0.1.0"
description = "Multi-agent warehouse and robot simulation"
requires-python = ">=3.10"
dependencies = ["langgraph>=0.2.0", "langchain-core>=0.3.0", "langchain-ollama>=0.2.0", "pydantic>=2.7.0", "streamlit>=1.35.0"]

[tool.setuptools.packages.find]
include = ["roboagent*"]
